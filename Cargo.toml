[package]
name = "math-vision"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs"] }
log = "0.4.35"
env_logger = "0.11.11"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pdfium-render = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["rayon", "png"] }
base64 = "0.23.1"
latex-rust = { version = "3.0.1", features = ["png"] }

ollama-rs = "0.3.6"
oar-ocr = { version = "0.10.2", features = ["auto-download"] }
whatlang = "0.18.0"
